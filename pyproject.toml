[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tungtungtungbrowser"
version = "0.1.0"
description = "Native iOS Safari automation with a CPU-rendered Linux runtime"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"

[project.optional-dependencies]
inspector = ["pymobiledevice3 @ git+https://github.com/doronz88/pymobiledevice3.git@776d601cec83b894c3ad0eeee8ab4db375a46e4a"]

[project.urls]
Repository = "https://github.com/felipdc/tungtungtungbrowser"
Issues = "https://github.com/felipdc/tungtungtungbrowser/issues"
Roadmap = "https://github.com/felipdc/tungtungtungbrowser/blob/main/docs/roadmap.md"

[project.scripts]
tungtungtungbrowser = "tungtungtungbrowser.cli:main"

[tool.setuptools.packages.find]
include = ["tungtungtungbrowser*"]
