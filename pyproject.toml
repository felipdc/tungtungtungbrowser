[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tungtungtungbrowser"
version = "0.1.0"
description = "Native iOS Safari automation with a CPU-rendered Linux runtime"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"

[project.scripts]
tungtungtungbrowser = "tungtungtungbrowser.cli:main"

[tool.setuptools.packages.find]
include = ["tungtungtungbrowser*"]
