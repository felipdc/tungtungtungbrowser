name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tungtungtungbrowser scripts
      - run: python scripts/check_public_tree.py
      - run: for script in scripts/*.sh; do bash -n "$script" || exit; done
      - run: for script in diagnostics/*.js; do node --check "$script" || exit; done
