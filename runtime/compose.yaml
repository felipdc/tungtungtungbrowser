services:
  iphone:
    image: tungtungtungbrowser:cpu
    build:
      context: ..
      dockerfile: runtime/Dockerfile
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp-vsock.json
    # VSOCK reaches vphoned. No /dev/dri, GPU, KVM, host network or privileged mode.
    devices:
      - /dev/vhost-vsock:/dev/vhost-vsock
    shm_size: ${TTT_SHM_SIZE:-6g}
    mem_limit: ${TTT_CONTAINER_MEMORY:-10g}
    memswap_limit: ${TTT_CONTAINER_MEMORY:-10g}
    cpus: ${TTT_CONTAINER_CPUS:-4}
    pids_limit: 512
    tmpfs:
      - /tmp:size=64m
    environment:
      REIMS_VGPU_CENSUS_DIR: ${TTT_RENDER_DIAGNOSTICS_DIR:-}
      TTT_CLOCK_INTERVAL_SECONDS: ${TTT_CLOCK_INTERVAL_SECONDS:-0}
    volumes:
      - type: bind
        source: ${TTT_VM_DIR:?Set TTT_VM_DIR to a prepared iOS bundle}
        target: /vm
      - type: bind
        source: ${TTT_CACHE_DIR:-${TTT_VM_DIR}/cache}
        target: /root/.cache
      - type: bind
        source: ${TTT_RUNTIME_DIR:?Set TTT_RUNTIME_DIR to the built pinned vphone-linux checkout}
        target: /runtime
        read_only: true
    command:
      - /vm
      - --source
      - /runtime
      - --memory-gib
      - "${TTT_VM_MEMORY_GIB:-3}"
      - --cpus
      - "${TTT_VM_CPUS:-4}"
      - --render-threads
      - "${TTT_RENDER_THREADS:-1}"
      - --tcg-cache-mib
      - "${TTT_TCG_CACHE_MIB:-1024}"
    # Also allow the bounded clock request to finish before native shutdown.
    stop_grace_period: 150s
    labels:
      app: tungtungtungbrowser
      renderer: cpu-only
